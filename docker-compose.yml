version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aitasker_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "AITaskerDB"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: aitasker_api:latest
    container_name: aitasker_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=AITaskerDB;User=root;Password=123456;CharSet=utf8mb4;
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
